name: Update Key Bindings

on:
  push:
    branches: [main]
    paths:
      - "autoexec.cfg"

permissions:
  contents: write

jobs:
  generate-keymap:
    name: Generate keymap and SVG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate keymap.yml
        run: uv run python main.py

      - name: Render key bindings SVG
        run: uv tool run --from keymap-drawer keymap -c config.yml draw keymap.yml -j layout.json -o images/key-bindings.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/key-bindings.svg
          git diff --staged --quiet || git commit -m "chore: update key bindings [skip ci]"
          git push || (git pull --rebase && git push)
