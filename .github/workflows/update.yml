name: Update

on:
  push:
    branches: [main]
    paths:
      - "autoexec.cfg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Build bindings
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --project keymap

      - name: Generate SVG
        run: uv run --project keymap python keymap/main.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git check-ignore -q images/bindings.svg; then
            echo "::warning::images/bindings.svg 被 .gitignore 忽略, 已使用 -f 强制提交."
            git check-ignore -v images/bindings.svg
          fi

          git add -f images/bindings.svg

          if ! git diff --staged --quiet; then
            git commit -m "chore: update bindings [skip ci]"
            git push || (git pull --rebase && git push)
          else
            echo "没有文件变更, 跳过提交."
          fi
