name: Update key bindings

on:
  push:
    branches: [main]
    paths:
      - "autoexec.cfg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-keymap:
    name: Generate keymap and SVG
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --project keymap

      - name: Generate keymap, SVG and timestamp
        run: uv run --project keymap python keymap/main.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git check-ignore -q images/key-bindings.svg; then
            echo "::warning::检测到 images/key-bindings.svg 被 .gitignore 忽略, 已用 -f 强制提交. 触发规则如下:"
            git check-ignore -v images/key-bindings.svg
          fi
          if git check-ignore -q images/mouse-bindings.svg; then
            echo "::warning::检测到 images/mouse-bindings.svg 被 .gitignore 忽略, 已用 -f 强制提交. 触发规则如下:"
            git check-ignore -v images/mouse-bindings.svg
          fi
          git add -f images/key-bindings.svg
          git add -f images/mouse-bindings.svg
          git diff --staged --quiet || git commit -m "chore: update key bindings [skip ci]"
          git push || (git pull --rebase && git push)
